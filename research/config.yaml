  termination: "预登记终止条件已触发：不得换分档指标、不得换 N、不得换排名窗口重试"
  default_enabled: false
  binding_7_enabled: 0          # 2026-11-12 22:01 已止血，本轮未改任何绑定/spec
  next_route: research/hypotheses/H-F-funding-multi-venue.md
